name: Test

on:
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: justtransfer
          POSTGRES_PASSWORD: justtransfer
          POSTGRES_DB: justtransfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U justtransfer -d justtransfer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: justtransfer
          RUSTFS_SECRET_KEY: justtransfer-test-password
          RUSTFS_ADDRESS: 0.0.0.0:9000
        ports:
          - 9000:9000
    env:
      # Test-only variables, so the suite never picks up an application database.
      TEST_DATABASE_URL: postgres://justtransfer:justtransfer@localhost:5432/justtransfer_test
      TEST_S3_URL: http://localhost:9000
      TEST_S3_ACCESS_KEY: justtransfer
      TEST_S3_SECRET_KEY: justtransfer-test-password
      TEST_S3_BUCKET: justtransfer-test
    steps:
      - uses: actions/checkout@v6
      - name: Wait for RustFS
        run: |
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$TEST_S3_URL")" != "000" ] && exit 0
            sleep 1
          done
          echo "RustFS did not answer on $TEST_S3_URL"
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-targets
