[package]
name = "justtransfer-backend"
version = "0.2.5-beta"
edition = "2021"

[dependencies]

# Security and cryptography
libsodium-sys-stable = "1.24.6"
argon2 = "0.6.0"
opaque-ke = { version = "5.0.0-pre.0", features = ["ristretto255", "argon2"] }
sha2 = "0.11.1"
# OS entropy for OPAQUE (opaque-ke 5 takes rand 0.10 RNGs).
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }

# Web framework and related libraries
axum = { version = "0.8.9", features = ["multipart", "tokio", "macros"]}
http = "1.5.0"
tower = { version = "0.5.3", features = ["timeout", "util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "catch-panic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
tokio = { version = "1.54.1", features = ["full"] }
validator = { version = "0.21.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-sessions = "0.15.0"
urlencoding = "2.1.3"

# Database and environment management
once_cell = "1.21.4"
diesel = { version = "2.4.0", features = ["postgres", "r2d2", "chrono", "uuid"] }
diesel_migrations = "2.4.0"
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x", "behavior-version-latest"] }

# Email sending
lettre = "0.11.24"

# Other utilities
base64 = "0.23.1"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde", "clock"] }
thiserror = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }

[dev-dependencies]
proptest = "1.6.0"
# OPAQUE runs Argon2 on every registration/login. Unoptimised it takes seconds
# per call, which makes debug builds and the test suite crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
